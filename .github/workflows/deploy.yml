name: deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: selivestru

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/siftrate-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          target: build
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/siftrate-migrate:latest
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/siftrate-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/siftrate
            git pull --ff-only
            docker compose pull api caddy db-migrate
            docker compose run --rm db-migrate
            docker compose up -d
            timeout 60 sh -c 'until curl -sf https://api.siftrate.com/api/health; do sleep 3; done'
