name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: selivestru

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/siftrate-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: api/Dockerfile
          target: build
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/siftrate-migrate:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/siftrate-app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Deploy over verified SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ && "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          mkdir -m 700 "$RUNNER_TEMP/siftrate-ssh"
          key="$RUNNER_TEMP/siftrate-ssh/key"
          hosts="$RUNNER_TEMP/siftrate-ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          ssh-keyscan -T 10 -t ed25519 "$SSH_HOST" > "$hosts" 2>/dev/null
          actual=$(ssh-keygen -lf "$hosts" -E sha256 | awk '{print $2}')
          [[ "$actual" == "$SSH_HOST_FINGERPRINT" ]]
          ssh_options=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts")
          remote="$SSH_USER@$SSH_HOST"
          stage="/tmp/siftrate-deploy-$REVISION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_options[@]}" "$remote" "umask 077; mkdir '$stage'"
          tar -cf - docker-compose.yml docker-compose.production.yml docker/Caddyfile.production .github/scripts/deploy-server.sh | \
            ssh "${ssh_options[@]}" "$remote" "tar -xf - -C '$stage'"
          printf '%s\n' "$REGISTRY_TOKEN" | ssh "${ssh_options[@]}" "$remote" \
            "sudo bash '$stage/.github/scripts/deploy-server.sh' '$stage' '$REVISION' '$REGISTRY_USER'"
