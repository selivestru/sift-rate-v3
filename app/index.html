<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app</title>
    <script>
      ;(function () {
        const root = document.documentElement

        let themeStored = null
        try {
          themeStored = JSON.parse(localStorage.getItem('theme'))
        } catch (e) {}
        const mode =
          themeStored === 'light' || themeStored === 'dark' || themeStored === 'system'
            ? themeStored
            : 'system'
        const resolved =
          mode === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode
        if (resolved === 'dark') {
          root.classList.add('dark')
          root.setAttribute('data-theme', 'dark')
        } else {
          root.classList.remove('dark')
          root.setAttribute('data-theme', 'light')
        }
        root.style.colorScheme = resolved

        const accents = [
          'red',
          'orange',
          'yellow',
          'green',
          'teal',
          'cyan',
          'blue',
          'indigo',
          'purple',
          'pink',
        ]
        let accentStored = null
        try {
          accentStored = JSON.parse(localStorage.getItem('accent'))
        } catch (e) {}
        const accent = accents.indexOf(accentStored) !== -1 ? accentStored : 'purple'
        root.setAttribute('data-accent', accent)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
